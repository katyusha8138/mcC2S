plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.147'
}

// 他プロジェクトのソースセットを Mod の一部として宣言するため、先に評価しておく
evaluationDependsOn(':core')
evaluationDependsOn(':common')

base {
    archivesName = "mcc2s-neoforge-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

neoForge {
    version = neo_version

    runs {
        server {
            server()
            gameDirectory = file('run/server')
            programArgument '--nogui'
        }
        client {
            client()
            gameDirectory = file('run/client')
            programArguments.addAll('--username', project.findProperty('mcname') ?: 'McC2SDev')
            // 例: ./gradlew :neoforge:runClient -Pquickplay=127.0.0.1:25599
            if (project.hasProperty('quickplay')) {
                programArguments.addAll('--quickPlayMultiplayer', project.property('quickplay'))
            }
        }
    }

    mods {
        "${mod_id}" {
            // 開発実行では、core / common のクラスも同じ Mod として読み込む(配布 jar には下の jar タスクで同梱)
            sourceSet sourceSets.main
            sourceSet project(':common').sourceSets.main
            sourceSet project(':core').sourceSets.main
        }
    }
}

dependencies {
    // common は api で core を公開している。開発実行(runServer/runClient)ではプロジェクト依存としてクラスパスに載る。
    implementation project(':common')
}

// 配布 jar には core と common のクラスを同梱する(Mod 1 ファイルで完結させる)。
// night-config は FML が提供するため同梱しない。
jar {
    from(project(':core').sourceSets.main.output)
    from(project(':common').sourceSets.main.output)
    from(rootProject.file('LICENSE'))
    manifest {
        attributes(
            'Implementation-Title': 'mcC2S',
            'Implementation-Version': mcc2s_version,
            'Implementation-Vendor': 'mcC2S contributors'
        )
    }
}

processResources {
    inputs.property 'mod_version', mcc2s_version
    filesMatching('META-INF/neoforge.mods.toml') {
        expand 'mod_version': mcc2s_version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// 配布 jar の難読化(文字列 → 名前)。開発実行(runClient / runServer)は難読化しない。
ext.obfuscation = [loader: 'neoforge']
apply from: rootProject.file('gradle/obfuscation.gradle')
