name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      # core / common / cli は Java 17 API に固定(--release 17)。neoforge は Java 21。
      # neoforge の初回ビルドは Minecraft のデコンパイルで数分かかる。
      - run: ./gradlew build :neoforge:jar :cli:jar --console=plain
