plugins {
    id 'java-library'
}

// common は Forge 1.20.1 (Java 17) / NeoForge 1.21.1 (Java 21) の両アダプタから使う。
// Minecraft のクラスには依存せず、ローダー固有の情報はインターフェース越しに受け取る。
tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:all', '-Werror']
    // 文字列連結を invokedynamic ではなく StringBuilder に展開する。定型文がブートストラップ引数に入ると、
    // 配布 jar の文字列難読化(ldc の置き換え)の対象から漏れるため。挙動は同じ。
    options.compilerArgs += ['-XDstringConcat=inline']
}

dependencies {
    api project(':core')

    testImplementation 'com.electronwill.night-config:toml:3.6.7'
    testImplementation 'com.google.code.gson:gson:2.11.0'
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'failed'
        exceptionFormat 'full'
    }
}

// リリース公開鍵(公開情報)を jar に同梱する。ファイルが無ければ同梱せず、鍵なしの最も厳格な動作になる。
def releaseKeyFile = rootProject.file('release/release-public-key.txt')
tasks.named('processResources') {
    inputs.files(releaseKeyFile.exists() ? files(releaseKeyFile) : files())
    if (releaseKeyFile.exists()) {
        from(releaseKeyFile) {
            into 'io/github/katyusha8138/mcc2s/common'
        }
    }
}
